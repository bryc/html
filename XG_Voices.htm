function buildList(set) {
document.querySelector(".current").classList.remove("current");
document.querySelector(`nav div#n${set}`).classList.add("current");
let list = Object.keys(data), s = "";

for(let i = 0; i < list.length; i++) {
    s += `<span id=b><div id=a>${list[i]}<span id=x>${i+1}</span></div><div id=d>`;
    let thing = data[list[i]][set];
    for(item in thing) {
    s += `<span voice="${thing[item]}" id=c>${item}</span>`;
    }
    s += `</div></span>`;
}

document.querySelector("list").innerHTML = s;
}

buildList(0);

<style>
nav{position:fixed;top:0;left:0;margin:10px 4px}
nav div{border-radius:3px;padding:4px 7px;cursor:pointer;color:#DFE5E999}
nav div.current {color:#DFE5E9;background:#3A3D4C88}
nav div:hover{background:#3A3D4C}
body{font-family:sans-serif;background:#0B0B13;color:#DFE5E9;font-size:20px;margin-left:160px}
div#a{font-weight:bold;text-align:center;padding-top:3px;padding-bottom:3px;background:#20212D;border-radius:3px 3px 0 0}
span#b{text-align:center;display:inline-block;width:272;margin:2px;vertical-align:text-top;position:relative}
span#c{outline:1px solid #FFF2;display:inline-block;text-align:center;width:34px;background:#627600;letter-spacing:-1px;}
span#c:hover{background:#515E29;cursor:default;font-weight:bold}
div#d{background:#3A3D4C;height:46px;border-radius:0 0 3px 3px}
span#x{float:right;display:inline-block;font-size:14px;margin-right:5px;margin-top:2px;z-index:5;color:#DFE5E999}

span#c:hover::after {
    top: 100%; left: 0; z-index: 1;
    position: absolute;
    white-space: nowrap;
    content: attr(voice);
    width: 100%;
    background: #111e;
    margin-top: 3px;
    padding:  9px 0 9px 0;
    box-shadow: 0px 2px 8px #111e;
    text-shadow: 0px 0px 5px #000, 0px 0px 5px #000, 0px 0px 5px #000;
    outline: 1px solid #000c;
    border-radius: 4px;
}
</style>
